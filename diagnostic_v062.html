<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P-225 MIDI接続診断 v0.6.2</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#f7f9fc;margin:0;padding:20px}main{max-width:800px;margin:auto}.panel{background:#1b2940;border-radius:16px;padding:20px;margin:16px 0}button{background:#4c9ce6;color:white;border:0;border-radius:10px;padding:15px;margin:5px;font-size:17px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c1423;padding:15px;border-radius:8px}strong{color:#85e5b6}</style></head><body><main><h1>🎹 P-225 MIDI接続診断 v0.6.2</h1><div class="panel"><p id="status">「接続を再診断」を押してください。</p><button id="start">接続を再診断</button><button id="clear">履歴を消去</button><p>入力された音：<strong id="note">なし</strong></p></div><div class="panel"><h2>診断結果</h2><pre id="log">待機中</pre></div></main><script>
'use strict';let access=null,ports=[],timer=null;const log=document.getElementById('log'),status=document.getElementById('status'),note=document.getElementById('note');function out(s){if(log.textContent==='待機中')log.textContent='';log.textContent+=s+'\n';}function shape(x){if(x===null)return 'null';if(x===undefined)return 'undefined';try{return Object.prototype.toString.call(x)+' keys='+Object.keys(x).join(',')}catch(e){return typeof x}}function err(e){return [e?.name,e?.message,String(e)].filter(Boolean).join(' / ')}function midi(ev){try{let d=Array.from(ev.data||[]);if(d.length>=3&&(d[0]&240)===144&&d[2]>0){note.textContent='番号 '+d[1]+' / 強さ '+d[2];out('鍵盤入力: '+d.join(' '));}}catch(e){out('受信エラー: '+err(e))}}
function gather(obj){let a=[];if(!obj)return a;try{if(typeof obj.values==='function')a.push(...Array.from(obj.values()));}catch(e){out('valuesエラー '+err(e))}try{if(typeof obj.forEach==='function')obj.forEach(v=>{if(!a.includes(v))a.push(v)})}catch(e){out('forEachエラー '+err(e))}try{if(typeof obj.length==='number')for(let i=0;i<obj.length;i++){let v=obj[i];if(v&&!a.includes(v))a.push(v)}}catch(e){out('lengthエラー '+err(e))}try{if(typeof obj[Symbol.iterator]==='function')for(const v of obj){if(v&&!a.includes(v))a.push(v)}}catch(e){out('iteratorエラー '+err(e))}return a.filter(Boolean)}
function scan(){if(!access)return;let inputs=access.inputs;out('inputs構造: '+shape(inputs));let list=gather(inputs);out('取得した入力: '+list.length);list.forEach((p,i)=>{out('入力'+(i+1)+': '+String(p.name||'名称不明')+' / '+shape(p));try{p.onmidimessage=midi}catch(e){out('受信設定失敗 '+err(e))}try{if(typeof p.addEventListener==='function')p.addEventListener('midimessage',midi)}catch(e){out('イベント設定失敗 '+err(e))}try{if(typeof p.open==='function')Promise.resolve(p.open()).then(()=>out('ポート開放成功: '+p.name)).catch(e=>out('ポート開放失敗 '+err(e)))}catch(e){out('open失敗 '+err(e))}});ports=list;status.textContent=list.length?'入力 '+list.length+' 件を検出。鍵盤を弾いてください。':'入力0件。下の診断結果を確認してください。';}
async function start(){clearInterval(timer);log.textContent='';note.textContent='なし';out('ブラウザー: '+navigator.userAgent);out('Web MIDI API: '+typeof navigator.requestMIDIAccess);if(typeof navigator.requestMIDIAccess!=='function'){status.textContent='Web MIDI API非対応';return}try{let req=navigator.requestMIDIAccess({sysex:false});out('アクセス要求: '+shape(req));access=await req;out('アクセス応答: '+shape(access));scan();try{access.onstatechange=()=>{out('接続状態が変化');scan()}}catch(e){out('状態監視失敗 '+err(e))}timer=setInterval(()=>{if(!ports.length)scan()},3000)}catch(e){status.textContent='アクセス取得失敗';out('エラー: '+err(e))}}
document.getElementById('start').onclick=start;document.getElementById('clear').onclick=()=>{log.textContent='待機中'};
</script></body></html>
